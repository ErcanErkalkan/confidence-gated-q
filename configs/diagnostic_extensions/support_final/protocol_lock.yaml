primary_metric:
  name: normalized_return_auc
  direction: higher_is_better
  definition: Per seed, average finite evaluation return at each checkpoint in the
    environment-specific locked primary window, integrate by the trapezoidal rule,
    and divide by the checkpoint-axis width.
planned_contrasts:
- name: raw_normalized_s1_vs_exact_count_gate
  left: raw_normalized_s1
  right: exact_count_gate
  status: primary_replication
- name: tolerance_knn_executed_vs_exact_count_gate
  left: tolerance_knn_executed
  right: exact_count_gate
  status: secondary_replication
- name: gaussian_affinity_executed_vs_exact_count_gate
