multiplicity:
  report_family_template: support_final.{environment_key}
  report_holm_scope: all_12_planned_contrasts_within_environment
  global_sensitivity_scope: three_primary_replication_rows_across_environments
  global_sensitivity_does_not_replace_report_holm: true
calibration:
  evidence_unit: evaluation_episode
  predictor: mean_support_score_across_episode_decisions
  action_correctness_rate_target: mean_memory_branch_action_correctness_across_steps_with_unique_analytic_optimal_action
  action_binary_target: episode_memory_majority_correct=1 when the episode action-correctness
    rate is above 0.5 and 0 when below 0.5; exact 0.5 ties are excluded from AUROC
    and PR-AUC but retained in rate calibration bins.
  failure_binary_target: episode_failure
  failure_prediction_score: one_minus_mean_support_score
  calibration_bins: 10_equal_width_bins_on_support_score
  selective_coverages:
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  bootstrap: 2000_seed_cluster_resamples_95_percentile_interval
  value_error_target: tabular_q_rmse_minus_neural_q_rmse_when_analytic_true_action_values_exist
  unavailable_policy: report_not_available_never_synthesize
tail_risk:
  primary_alpha: 0.1
  sensitivity_alpha: 0.05
  definition: arithmetic_mean_of_lowest_max_1_ceil_alpha_times_n_finite_values
  seed_level_and_episode_level_must_be_labeled_separately: true
