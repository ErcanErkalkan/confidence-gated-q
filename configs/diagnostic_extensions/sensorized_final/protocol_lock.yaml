agents:
- agent_id: feed_forward_dqn
  kind: dqn
- agent_id: selected_temporal_drqn
  kind: drqn
  frozen_candidate_id: temporal_drqn_seq4
- agent_id: fuzzy_relative_reliability
  kind: fuzzy_reliability_gate
- agent_id: selected_approximate_support
  kind: support_estimator_gate
  frozen_candidate_id: raw_normalized_s1
- agent_id: sensorized_controller
  kind: uav_sensorized_motor_controller
analysis:
  primary_metric: normalized_return_auc
  difference_direction: left_minus_right
  bootstrap_confidence_level: 0.95
  bootstrap_resamples: 10000
  lower_tail_alpha_primary: 0.1
  lower_tail_alpha_sensitivity: 0.05
  report_holm_family: sensorized_final_eight_rows
  report_holm_scope: all_eight_rows_together
  planned_contrasts:
  - contrast_id: selected_temporal_drqn_vs_feed_forward_dqn
    status: primary_replication
    left: selected_temporal_drqn
    right: feed_forward_dqn
  - contrast_id: fuzzy_relative_reliability_vs_feed_forward_dqn
    status: secondary_replication
    left: fuzzy_relative_reliability
    right: feed_forward_dqn
  - contrast_id: selected_approximate_support_vs_feed_forward_dqn
    status: secondary_replication
    left: selected_approximate_support
    right: feed_forward_dqn
  - contrast_id: sensorized_controller_vs_feed_forward_dqn
    status: secondary_replication
    left: sensorized_controller
    right: feed_forward_dqn
  secondary_outcomes:
  - success_and_failure
  - collision_and_risk_zone
  - seed_and_episode_lower_tail_return
  - trajectory_error
  - recovery_events
  - constraint_duration
  - saturation_duration
  - target_visibility_episodes
  - failure_stage_labels
  - fragmentation_and_aliasing
  - support_correctness_proxy_when_analytic_optimal_action_is_unavailable
  generator_pooling: prohibited
  negative_null_zero_success_results: retain
  practical_readiness_claim: prohibited
trace_lock:
  schema_version: sensorized_sil_trace_v2
  phases:
  - eval
  compression: gzip
  trajectory_error: Euclidean latent-position distance to the target after the action
  constraint_active: collision or risk-zone occupancy after the action
  recovery_event: Previous decision was constraint-active, current decision is not,
    and trajectory error decreased relative to the previous decision.
  saturation_active: post-action motor_saturation is strictly greater than zero
  constraint_duration_seconds: constraint-active steps divided by 60
  saturation_duration_seconds: saturation-active steps divided by 60
  target_visibility_episode: any/all/fraction of post-action visible decisions
  failure_stage_precedence:
  - success
  - collision_out_of_bounds
  - collision_unstable
  - collision_contact
  - timeout_no_progress
  - timeout_near_target
  - timeout_partial_progress
  - ongoing
  timeout_no_progress_rule: final_error_not_less_than_initial_error_minus_0.05
  timeout_near_target_rule: minimum_error_at_or_below_goal_tolerance_without_success
immutability:
  normative_file: configs/diagnostic_extensions/sensorized_final/protocol_lock.yaml
  digest_file: configs/diagnostic_extensions/sensorized_final/protocol_lock.sha256
  digest_algorithm: sha256_exact_bytes
  silent_edit_policy: fail_closed
  amendment_pattern: SENSOR_FINAL_PROTOCOL_AMENDMENT_YYYY-MM-DD_NN.yaml
  amendment_must_precede_affected_final_run: true
