experiment_name: final_localized_multistep_reward_or_policy_shift
output_dir: results/diagnostic_extensions/final_shifts/execution/localized_multistep_reward_or_policy_shift
runtime:
  torch_threads: 1
  torch_interop_threads: 1
  workers: 6
seeds: []
evaluation:
  interval_steps: 1000
  episodes: 200
analysis:
  evidence_class: replication
  mechanism_id: localized_multistep_reward_or_policy_shift
  severity_id: localized_risk_penalty_064
  primary_metric: normalized_return_auc
  post_shift_window:
  - 12000
  - 24000
  report_level_holm_family: independent_shift_primary
  generator_pooling: prohibited
  planned_contrasts:
  - name: relative_reliability_fuzzy_vs_count_gated_tau_20
    left: relative_reliability_fuzzy
    right: count_gated_tau_20
    metric: normalized_return_auc
    status: primary
  - name: same_input_crisp_vs_relative_reliability_fuzzy
    left: same_input_crisp
    right: relative_reliability_fuzzy
    metric: normalized_return_auc
    status: co_primary_mechanism_contrast
  protocol: configs/diagnostic_extensions/INDEPENDENT_SHIFT_PROTOCOL.yaml
envs:
- name: final-localized-multistep-reward-or-policy-shift
  mechanism_id: localized_multistep_reward_or_policy_shift
  severity_id: localized_risk_penalty_064
  id: LocalizedRewardShift-v0
  seeds:
  - 12060
  - 12061
  - 12062
  - 12063
  - 12064
