agents:
- name: relative_reliability_fuzzy
  kind: fuzzy_reliability_gate
  params: &id004
    double_dqn: false
    learning_rate: 0.0003
    tabular_learning_rate: 0.2
    batch_size: 32
    replay_capacity: 100000
    replay_warmup: 512
    train_frequency: 16
    target_update_interval: 500
    hidden_size: 128
    tau: 20
    fuzzy_tau_support: 20
    reliability_beta: 0.05
    reliability_prior_strength: 5
    reliability_epsilon: 1.0e-08
    epsilon_decay_steps: 20000
    fuzzy_reliability_consequents: &id005
    - 0.0
    - 0.2
    - 0.7
    - 0.1
    - 0.95
- name: count_gated_tau_20
  kind: count_gated
  params: *id004
- name: same_input_crisp
  kind: fuzzy_reliability_gate
  params:
    double_dqn: false
    learning_rate: 0.0003
    tabular_learning_rate: 0.2
    batch_size: 32
    replay_capacity: 100000
    replay_warmup: 512
    train_frequency: 16
    target_update_interval: 500
    hidden_size: 128
    tau: 20
    fuzzy_tau_support: 20
    reliability_beta: 0.05
    reliability_prior_strength: 5
    reliability_epsilon: 1.0e-08
    epsilon_decay_steps: 20000
    fuzzy_reliability_consequents: *id005
    fuzzy_risk_ablation_mode: crisp_threshold
    fuzzy_crisp_support_threshold: 0.5
    fuzzy_crisp_reliability_threshold: 0.5
