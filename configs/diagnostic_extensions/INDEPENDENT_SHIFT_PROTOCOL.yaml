schema_version: 2
protocol_id: independent_shift_replication
lock_status: finalized_locked_design
locked_at: '2026-08-03T07:45:22+03:00'
locked_source_commit: 061241406e9d5175a99516ba337ab92e4726d7ce
final_results_inspected: false
purpose: Define the complete independent-shift experiment family, including development-only selection, finalized shift severities,
  finalized fuzzy/crisp mappings, final seed sets, outcomes, contrasts, multiplicity control, detection-delay diagnostics,
  and fail-closed execution rules.
immutability:
  status: locked
  rule: The public protocol is the finalized scientific design for the executed experiment family. Scientific parameters,
    seeds, budgets, contrasts, mappings, and stopping rules are fixed.
seed_registry:
  source_file: configs/diagnostic_extensions/independent_shift_seed_registry.yaml
  development_registered_range: 11000-11099
  final_registered_range: 12000-12099
  unused_development_seeds_remain_reserved: 11030-11099
  unused_final_seeds_remain_reserved: 12090-12099
analysis_lock:
  primary_metric:
    metric_name: normalized_return_auc
    window: post_shift_inclusive
    definition: At each checkpoint, average undiscounted episodic return over the locked evaluation episodes. Starting with
      the checkpoint at interaction 12000, integrate checkpoint means by the trapezoidal rule through interaction 24000 and
      divide by 12000, the checkpoint-axis span. This is time-axis normalization and is not min-max reward scaling.
    direction: higher_is_better
  primary_contrast:
    contrast_id: relative_reliability_fuzzy_vs_count_gated_tau_20
    left: relative_reliability_fuzzy
    right: count_gated_tau_20
    alternative: two_sided
    status: primary
  co_primary_contrast:
    contrast_id: same_input_crisp_vs_relative_reliability_fuzzy
    left: same_input_crisp
    right: relative_reliability_fuzzy
    alternative: two_sided
    status: co_primary_mechanism_contrast
  secondary_diagnostics:
    success_auc: Post-shift trapezoidal success-rate AUC divided by the post-shift checkpoint span; higher is better.
    failure_probability: Failed evaluation episodes divided by all finite evaluation episodes, reported by checkpoint and
      post-shift aggregate; lower is better.
    detection_delay: Training interactions from shift onset to the first of two consecutive checkpoints satisfying the predeclared
      correct-detection criterion; non-detections are retained as right-censored/not-detected.
    branch_correctness: Evaluation-only rate at which the score-predicted better branch matches the actually better branch
      when an analytic or enumerated oracle exists; unavailable otherwise and never synthesized.
    lower_tail_summaries: Seed-level minimum return, lower quantiles, worst-decile mean, and empirical lower CVaR at alpha
      0.10, with alpha 0.05 sensitivity only where sample size is sufficient. Episode-level summaries remain labeled separately
      when raw episode rows exist.
  secondary_inference_policy:
    status: descriptive_diagnostic
    p_values: prohibited
    uncertainty: seed_bootstrap_intervals_where_defined
    promotion_to_confirmatory: not_permitted_post_execution
  uncertainty_unit: seed
  pairing: exact_seed_with_common_evaluation_seed_schedule
  confidence_interval: paired_seed_bootstrap_95_percent
  bootstrap_samples: 10000
  inferential_tests:
    primary: paired_t_two_sided
    sensitivity: wilcoxon_signed_rank_two_sided
  missing_metric_policy: report_not_available_with_reason
  detection_delay_criterion:
    aggregation_unit: agent_seed_checkpoint
    eligible_episode_definition: An evaluation episode is eligible only when actually_better_branch is exactly tabular or
      neural. Ties and unavailable targets are excluded from this diagnostic denominator, never converted to errors.
    correct_episode_definition: predicted_better_branch_equals_actually_better_branch
    minimum_eligible_episodes_per_checkpoint: 20
    checkpoint_is_correct_when: branch_correctness_rate_strictly_greater_than_0_50
    consecutive_checkpoint_requirement: 2
    search_window: checkpoints_12000_through_24000_inclusive
    reported_detection_checkpoint: first_checkpoint_of_first_qualifying_pair
    delay_definition: detection_checkpoint_minus_12000_training_interactions
    no_qualifying_pair: right_censored_not_detected_at_24000
    unavailable_rule: If analytic optimal-action evidence is unavailable or fewer than 20 eligible episodes exist at every
      post-shift checkpoint, detection delay is reported unavailable with the reason; it is not synthesized.
agent_lock:
  agents:
  - name: relative_reliability_fuzzy
    role: focal_method
    gate: fuzzy_relative_reliability
    gate_inputs:
    - normalized_support
    - relative_reliability_score
  - name: count_gated_tau_20
    role: primary_comparator
    gate: exact_count_threshold
    tau: 20
  - name: same_input_crisp
    role: co_primary_mechanism_comparator
    gate: crisp_threshold_on_same_inputs
    gate_inputs:
    - normalized_support
    - relative_reliability_score
  common_parameters:
    double_dqn: false
    learning_rate: 0.0003
    tabular_learning_rate: 0.2
    batch_size: 32
    replay_capacity: 100000
    replay_warmup: 512
    train_frequency: 16
    target_update_interval: 500
    hidden_size: 128
    tau: 20
    fuzzy_tau_support: 20
    reliability_beta: 0.05
    reliability_prior_strength: 5
    reliability_epsilon: 1.0e-08
    epsilon_decay_steps: 20000
  relative_reliability_fuzzy_parameters:
    selected_candidate_id: fuzzy_triangular_balanced
    membership_family: triangular
    support_breakpoints: &id001
    - 0.0
    - 0.5
    - 1.0
    reliability_breakpoints: &id002
    - 0.0
    - 0.5
    - 1.0
    fuzzy_reliability_consequents: &id003
    - 0.0
    - 0.2
    - 0.7
    - 0.1
    - 0.95
    gate_min: 0.05
    gate_max: 0.95
    fuzzy_fallback_risk_mode: disabled
    fuzzy_risk_ablation_mode: full
  same_input_crisp_parameters:
    selected_candidate_id: crisp_s070_r030
    mapping: same_input_crisp_threshold
    support_threshold: 0.7
    relative_reliability_threshold: 0.3
    gate_min: 0.05
    gate_max: 0.95
    fuzzy_fallback_risk_mode: disabled
    fuzzy_risk_ablation_mode: crisp_threshold
  fairness_rules:
  - Identical network architecture, optimizer, replay, update schedule, and exploration schedule.
  - Identical interaction, checkpoint, and evaluation budgets within a mechanism.
  - Identical training and evaluation seed sets within every planned contrast.
  - No agent hyperparameter may be selected from the new development shift outcomes.
  descriptive_comparators:
  - name: tabular
    kind: tabular
    inferential_role: descriptive_only
  - name: dqn
    kind: dqn
    inferential_role: descriptive_only
development_selection:
  seed_scope: development_seeds_only
  selection_metric: post_shift_success_auc
  selection_uses_p_values: false
  final_seed_results_used: false
  selected_severities:
    transition_dynamics_shift: transition_slip_035
    observation_shift: observation_gain_085
    localized_multistep_reward_or_policy_shift: localized_risk_penalty_064
  mapping_selection_rule:
    locked_before_outcomes: true
    unit: candidate_within_mapping_family
    environment_score: mean primary metric across the ten locked development seeds
    environment_rank: descending environment score, average ranks for exact ties
    ordered_criteria:
    - lowest_mean_environment_rank
    - lowest_worst_environment_rank
    - lower_median_warm_cpu_mapping_latency_ns
    - lexical_candidate_id
    p_values_used: false
    final_seed_results_used: false
  selected_mappings:
    relative_reliability_fuzzy: fuzzy_triangular_balanced
    same_input_crisp: crisp_s070_r030
