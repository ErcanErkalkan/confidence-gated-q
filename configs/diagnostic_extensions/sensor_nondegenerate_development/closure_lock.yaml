relationship_to_prior_lock: New closure family prompted by the strict audit. It does
  not edit or replace SENSOR_FINAL_PROTOCOL_LOCK.yaml and does not reinterpret its
  all-floor result.
scientific_question: Under a horizon and interaction budget capable of producing discriminating
  waypoint outcomes, which of sensing factors, temporal state, and the low- versus
  high-level control interface explains the sensorized learned-policy failure?
claim_boundaries:
  causal_language_requires_manipulation_and_nondegenerate_outcomes: true
  shaped_return_without_waypoint_success_is_not_task_competence: true
  simulator_only: true
  practical_readiness_claim: prohibited
  hardware_or_flight_claim: prohibited
