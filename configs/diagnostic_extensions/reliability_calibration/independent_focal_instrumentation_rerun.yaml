  params:
    double_dqn: false
    learning_rate: 0.001
    tabular_learning_rate: 0.02
    batch_size: 32
    replay_capacity: 1000
    replay_warmup: 128
    train_frequency: 16
    target_update_interval: 100
    hidden_size: 32
    tau: 20
    fuzzy_tau_support: 20
    reliability_beta: 0.05
    reliability_prior_strength: 5
    reliability_epsilon: 1.0e-08
    epsilon_decay_steps: 3000
    gate_min: 0.05
    gate_max: 0.95
    fuzzy_fallback_risk_mode: disabled
    fuzzy_risk_ablation_mode: crisp_threshold
    fuzzy_membership_shape: triangular
    fuzzy_reliability_membership_shape: triangular
    fuzzy_support_breakpoints: *id001
    fuzzy_reliability_breakpoints: *id002
    fuzzy_reliability_consequents: *id003
    fuzzy_crisp_support_threshold: 0.7
    fuzzy_crisp_reliability_threshold: 0.3
