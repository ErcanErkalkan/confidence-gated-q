    - 0.5
    - 1.0
    fuzzy_reliability_breakpoints: &id002
    - 0.0
    - 0.5
    - 1.0
    fuzzy_reliability_consequents: &id003
    - 0.0
    - 0.2
    - 0.7
    - 0.1
    - 0.95
- name: same_input_crisp
