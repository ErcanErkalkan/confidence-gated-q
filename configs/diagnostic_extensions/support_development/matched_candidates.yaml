experiment_name: support_estimator_matched_development
output_dir: results/diagnostic_extensions/support_development/execution
runtime:
  torch_threads: 1
  torch_interop_threads: 1
  workers: 6
seeds: []
evaluation:
  interval_steps: 1000
  episodes: 10
analysis:
  evidence_class: development
  analysis_status: locked_matched_support_estimator_development
  primary_metric: return_auc
  candidate_registry: configs/diagnostic_extensions/support_development/candidate_registry.yaml
  selection_rule: mean_rank_then_worst_rank_then_failure_then_latency_then_id
  final_seed_ranges_prohibited:
  - 12000-12099
  - 14000-14099
  - 16000-16099
  planned_contrasts: []
envs:
- name: ApplicationNavigation-support-estimator-development
  id: ApplicationNavigationSupportShift-v0
  seeds:
  - 13000
  - 13001
  - 13002
  - 13003
  - 13004
  kwargs:
    goal_split: train
    slip_probability: 0.05
    max_steps: 120
  eval_kwargs:
    goal_split: deployment
  training_steps: 16000
  max_steps: 120
  success_mode: positive_terminal
- name: transition-dynamics-support-estimator-development
  id: TransitionDynamicsShift-v0
  seeds:
  - 13000
  - 13001
  - 13002
  - 13003
  - 13004
  kwargs:
    size: 9
    goal_split: all
    max_steps: 160
    shift_after: 12000
    pre_shift_slip_probability: 0.05
    post_shift_slip_probability: 0.35
  training_steps: 16000
  max_steps: 160
  success_mode: positive_terminal
agents:
- name: raw_normalized_s1
  kind: support_estimator_gate
  params:
    double_dqn: false
    learning_rate: 0.0003
    tabular_learning_rate: 0.2
    batch_size: 32
    replay_capacity: 100000
    replay_warmup: 512
    train_frequency: 16
    target_update_interval: 500
    hidden_size: 128
    epsilon_decay_steps: 16000
    approximate_support_k: 3
    approximate_support_bandwidth: 0.25
    approximate_support_tau: 1.0
    support_estimator_type: gaussian_affinity
    support_representation_type: raw_state
    support_index_type: brute_force
    support_scale_epsilon: 1.0e-08
    support_covariance_regularization: 0.0001
