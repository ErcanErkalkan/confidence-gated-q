schema_version: 1
purpose: Lock evidence classes, canonical source selection, report-level multiplicity
  scopes, principal contrasts, and manuscript-wide sensitivity eligibility.
allowed_evidence_classes:
- development
- confirmatory
- replication
- exploratory
- descriptive
rules:
  planned_report_holm_scope: one vector over every row in the source report
  pairwise_report_holm_scope: one vector per environment and metric
  primary_confirmatory: Only canonical planned primary-outcome rows in independent
    confirmatory families; replication, exploratory, descriptive, pairwise, and derived
    supplemental rows are excluded from the manuscript-wide sensitivity family.
  derivative_policy: Combined or reported copies are excluded when a canonical source
    contains the same rows. Reported files are included only for explicitly selected
    supplemental mechanism contrasts absent from the canonical source.
sources:
- source_id: adaptive_gate_planned
  source_file: results/adaptive_gate_compact_validation/planned_contrasts.csv
  source_kind: planned
  evidence_class: confirmatory
  include: true
  report_family: adaptive_gate_compact_validation.planned
  report_holm_scope: file
  principal_planned: true
  primary_confirmatory: true
  expected_included_rows: 12
  expected_contrasts:
  - fuzzy_vs_count
  - fuzzy_vs_support_abstain
  - fuzzy_vs_dqn
  - fuzzy_vs_tabular
