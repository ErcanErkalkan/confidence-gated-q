decision_surface_lock:
  grid_points_per_axis: 41
  finite_difference_step: 0.025
  boundary_probe_epsilon: 0.0001
  perturbation_delta: 0.01
  perturbation_stable_absolute_change: 0.05
  metrics:
  - local_lipschitz_style_mean
  - local_lipschitz_style_max
  - boundary_output_change_mean
  - boundary_output_change_max
  - perturbation_stability_rate
  - perturbation_absolute_change_mean
latency_lock:
  cpu_threads: 1
  warmup_calls: 5000
  measured_calls_per_repeat: 20000
  repeats: 7
  input_schedule: deterministic_257_point_lattice
  selected_statistic: median_nanoseconds_per_mapping_call
  includes: mapping_only_after_support_and_reliability_are_available
  excludes:
  - network_inference
  - residual_estimation
  - support_estimation
  - q_value_mixing
